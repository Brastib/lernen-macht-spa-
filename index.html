<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lern-App</title>
<meta name="theme-color" content="#f5f5f7">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lern-App">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Symbole (Linien-Icons) -->

  <defs>

    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13l2.5-8h11L20 13v6H4z"/><path d="M4 13h4.5l1 2h5l1-2H20"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6.5V5h14v1.5M12 5v14M9.5 19h5"/></symbol>

    <symbol id="i-homework" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3v3h6V3M8.5 12l2 2 4-4.5M8.5 17.5h7"/></symbol>

    <symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2.5"/><rect x="8" y="6" width="8" height="3.5" rx="1"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></symbol>
    <symbol id="i-atom" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/></symbol>
    <symbol id="i-ruler2" viewBox="0 0 24 24"><path d="M3 16.5L16.5 3l4.5 4.5L7.5 21z"/><path d="M7 12.5l2 2M10 9.5l2 2M13 6.5l2 2"/></symbol>
    <symbol id="i-sigma" viewBox="0 0 24 24"><path d="M17 5H7l6 7-6 7h10"/></symbol>

<main id="home" class="home">
  <header class="homehead">
    <div class="titles">
      <button id="navBack" class="back" hidden><svg class="ic"><use href="#i-left"/></svg><span id="navBackLabel">Bibliothek</span></button>
      <p id="navEyebrow" class="eyebrow">Lern-App</p>
      <h1 id="navTitle">Bibliothek</h1>
      <p class="meta"><span id="count"></span><span id="storage"></span></p>
    </div>
    <div id="navActions" class="actions"></div>
  </header>
  <div id="view"></div>
</main>

<!-- Auswahl-Leiste in der Buch-Ansicht -->
<div id="selbar" class="selbar" hidden>
  <span id="selCount" class="selcount"></span>
  <button id="selLeft" class="btn round" aria-label="Nach vorn" title="Nach vorn"><svg class="ic"><use href="#i-left"/></svg></button>
  <button id="selRight" class="btn round" aria-label="Nach hinten" title="Nach hinten"><svg class="ic"><use href="#i-right"/></svg></button>
  <button id="selPdf" class="btn" title="Auswahl als PDF"><svg class="ic"><use href="#i-pdf"/></svg><span>PDF</span></button>
  <button id="selMove" class="btn"><svg class="ic"><use href="#i-move"/></svg><span>Verschieben</span></button>
  <button id="selDelete" class="btn danger"><svg class="ic"><use href="#i-trash"/></svg><span>Löschen</span></button>
  <button id="selDone" class="btn primary">Fertig</button>
</div>

<!-- Zuschneiden -->
<section id="crop" class="screen dark" hidden>
  <div class="bar">
    <button id="cropCancel" class="txt">Abbrechen</button>
    <span id="cropHint" class="hint">Ecken mit Pencil oder Finger anpassen</span>
    <button id="cropRotate" class="icbtn" aria-label="Drehen" title="Drehen"><svg class="ic"><use href="#i-rotate"/></svg></button>
  </div>
  <div id="stage" class="stage">
    <canvas id="photo"></canvas>
    <svg id="overlay"></svg>
  </div>
  <div class="bar bottom">
    <div class="seg">
      <button id="cropAuto"><svg class="ic"><use href="#i-auto"/></svg><span>Erkennen</span></button>
      <button id="cropFull"><svg class="ic"><use href="#i-full"/></svg><span>Ganzes Bild</span></button>
    </div>
    <div class="seg" role="group" aria-label="Modus">
      <button id="modeColor" class="on">Farbe</button>
      <button id="modeGray">Text</button>
    </div>
    <span class="spacer"></span>
    <button id="cropSaveNext" class="btn ghost">Speichern &amp; weiter</button>
    <button id="cropSave" class="btn light">Speichern</button>
  </div>
</section>

<!-- Buch-Leser -->
<section id="viewer" class="screen reader" hidden>
  <div class="bar">
    <button id="viewClose" class="txt strong">Fertig</button>
    <span id="viewInfo" class="hint"></span>
    <button id="viewToc" class="icbtn" aria-label="Inhaltsverzeichnis" title="Inhaltsverzeichnis"><svg class="ic"><use href="#i-list"/></svg></button>
    <button id="viewMark" class="icbtn markbtn" aria-label="Lesezeichen" title="Lesezeichen setzen"><svg class="ic"><use href="#i-bookmark"/></svg></button>
    <button id="viewEdit" class="btn primary"><svg class="ic"><use href="#i-pen"/></svg><span>Beschriften</span></button>
  </div>
  <div id="readStage" class="readstage">
    <button id="viewPrev" class="nav" aria-label="Zurückblättern"><svg class="ic"><use href="#i-left"/></svg></button>
    <div id="spread" class="spread"></div>
    <button id="viewNext" class="nav" aria-label="Weiterblättern"><svg class="ic"><use href="#i-right"/></svg></button>
  </div>
  <div class="readfoot">
    <input id="readScrub" type="range" min="0" max="0" value="0" aria-label="Seite wählen">
    <span id="readPage" class="readpage"></span>
  </div>
</section>

<!-- Schreiben mit Pencil -->
<section id="editor" class="screen editor" hidden>
  <div class="bar edbar">
    <button id="edDone" class="txt strong">Fertig</button>
    <div id="edTools" class="toolgroup">
      <div class="tools">
        <button id="ed_pen" class="tool" aria-label="Stift" title="Stift"><svg class="ic"><use href="#i-pen"/></svg></button>
        <button id="ed_marker" class="tool" aria-label="Marker" title="Marker"><svg class="ic"><use href="#i-marker"/></svg></button>
        <button id="ed_eraser" class="tool" aria-label="Radierer" title="Radierer"><svg class="ic"><use href="#i-eraser"/></svg></button>
        <button id="ed_lasso" class="tool" aria-label="Lasso" title="Lasso: Striche einkreisen und verschieben"><svg class="ic"><use href="#i-lasso"/></svg></button>
        <button id="ed_text" class="tool" aria-label="Text" title="Textfeld: auf das Blatt tippen und schreiben"><svg class="ic"><use href="#i-text"/></svg></button>
      </div>
      <span class="divider"></span>
      <div id="edColors" class="swatches"></div>
      <span class="divider"></span>
      <div id="edSizes" class="sizes">
        <button aria-label="Fein" title="Fein"><i style="--d:4px"></i></button>
        <button aria-label="Mittel" title="Mittel"><i style="--d:7px"></i></button>
        <button aria-label="Kräftig" title="Kräftig"><i style="--d:11px"></i></button>
      </div>
    </div>
    <button id="edMath" class="chip mathbtn" title="Mathe-Werkzeuge"><svg class="ic"><use href="#i-tool-triangle"/></svg><span>Werkzeuge</span></button>
    <div class="edright">
      <button id="edUndo" class="icbtn" aria-label="Rückgängig" title="Rückgängig"><svg class="ic"><use href="#i-undo"/></svg></button>
      <button id="edRedo" class="icbtn" aria-label="Wiederholen" title="Wiederholen"><svg class="ic"><use href="#i-redo"/></svg></button>
      <button id="edZoomOut" class="icbtn" aria-label="Verkleinern" title="Verkleinern"><svg class="ic"><use href="#i-zoom-out"/></svg></button>
      <button id="edZoomIn" class="icbtn" aria-label="Vergrößern" title="Vergrößern"><svg class="ic"><use href="#i-zoom-in"/></svg></button>
      <button id="edFinger" class="chip" title="Was der Finger auf dem Blatt macht"><svg class="ic"><use href="#i-hand"/></svg><span id="edFingerLabel"></span></button>
    </div>
  </div>
  <button id="edSelDelete" class="chip danger floating" hidden><svg class="ic"><use href="#i-trash"/></svg><span>Auswahl löschen</span></button>
  <div id="edScroll" class="edscroll">
    <div id="edPage" class="edpage">
      <canvas id="edBg"></canvas>
      <canvas id="edInk"></canvas>
      <canvas id="edLive"></canvas>
      <svg id="edTpl" class="tpl" preserveAspectRatio="none"></svg>
      <svg id="edSel" class="sellayer" preserveAspectRatio="none"></svg>
    </div>
  </div>
</section>

<!-- Programmieren -->
<section id="coder" class="screen coder" hidden>
  <div class="bar cdbar">
    <button id="cdDone" class="txt strong">Fertig</button>
    <button id="cdTitle" class="cdtitle" title="Umbenennen"></button>
    <span id="cdLang" class="cdlang"></span>
    <div id="cdTabs" class="seg cdtabs"></div>
    <span class="spacer"></span>
    <button id="cdMore" class="icbtn" aria-label="Mehr"><svg class="ic"><use href="#i-more"/></svg></button>
    <button id="cdStop" class="btn" hidden><svg class="ic"><use href="#i-stop"/></svg><span>Stopp</span></button>
    <button id="cdRun" class="btn primary"><svg class="ic"><use href="#i-play"/></svg><span>Starten</span></button>
  </div>
  <div class="cdbody">
    <div class="cdedit">
      <div id="cdKeys" class="cdkeys"></div>
      <div class="cdwrap">
        <pre id="cdGutter" class="cdgutter" aria-hidden="true"></pre>
        <textarea id="cdArea" class="cdarea" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" wrap="off" aria-label="Code"></textarea>
      </div>
    </div>
    <div class="cdrun">
      <div class="cdrunhead"><b id="cdOutTitle">Ausgabe</b><button id="cdFull" class="icbtn" aria-label="Groß anzeigen" title="Groß anzeigen"><svg class="ic"><use href="#i-full"/></svg></button></div>
      <div id="cdOut" class="cdout"></div>
    </div>
  </div>
</section>

<!-- Lernkarten üben -->
<section id="study" class="screen study" hidden>
  <div class="bar">
    <button id="studyClose" class="txt strong">Fertig</button>
    <span id="studyInfo" class="hint"></span>
    <span id="studyHud" class="studyhud"></span>
  </div>
  <div id="studyProg" class="studyprog"><i></i></div>
  <div class="studystage">
    <div id="studyCard" class="studycard"></div>
    <div id="studyActions" class="studyactions"></div>
  </div>
</section>

<div id="busy" class="busy" hidden><div class="spinner"></div><span id="busyText">Wird bearbeitet …</span></div>
<div id="toast" class="toast" role="status" hidden></div>

<input id="fileCamera" type="file" accept="image/*" capture="environment" hidden>
<input id="filePhotos" type="file" accept="image/*" multiple hidden>
<input id="filePdf" type="file" accept="application/pdf,.pdf" hidden>
<input id="fileBackup" type="file" accept=".json,application/json" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
